<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Furniture Placement - Markerless AR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
</head>
<body style="margin: 0; padding: 0;">

    <!-- A-Frameシーン -->
    <a-scene embedded arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3">
        <!-- 家具の3Dモデル。初期状態では非表示 -->
        <a-entity id="simplelowtable" gltf-model="url(simplelowtable.glb)" scale="1 1 1" position="0 0 -5" visible="false"></a-entity>

        <!-- カメラ -->
        <a-entity camera></a-entity>
    </a-scene>

    <!-- 家具を表示するボタン -->
    <button id="show-model-btn" style="position: absolute; top: 10px; left: 10px; z-index: 10;">
        Show Simple Low
    </button>

    <!-- 家具の表示を制御するスクリプト -->
    <script>
        // ボタンと3Dモデルの要素を取得
        let button = document.getElementById('show-model-btn');
        let furniture = document.getElementById('simplelowtable');

        // デバッグ用：コンソールで確認
        console.log("Furniture model:", furniture);
        
        // ボタンクリックで3Dモデルを表示
        button.addEventListener('click', function () {
            // visible属性をtrueにしてモデルを表示
            furniture.setAttribute('visible', true);
            console.log("Button clicked. Furniture is now visible.");
        });
    </script>

</body>
</html>
