<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Furniture Placement - Markerless AR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <style>
        /* ボタンのスタイル */
        #show-model-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #show-model-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body style="margin: 0; padding: 0;">

    <!-- A-Frameシーン -->
    <a-scene webxr="optionalFeatures: hit-test;" xrweb="optionalFeatures: hit-test;" renderer="logarithmicDepthBuffer: true" embedded>
        <!-- 平面検知用 -->
        <a-entity id="reticle" geometry="primitive: ring; radiusInner: 0.05; radiusOuter: 0.1;"
                  material="color: yellow; shader: flat;" position="0 0 -5" visible="false"></a-entity>
    
        <!-- 家具の3Dモデル -->
        <a-entity id="simplelowtable" gltf-model="url(./models/simplelowtable.glb)" scale="0.5 0.5 0.5" visible="false"></a-entity>
    
        <!-- カメラ -->
        <a-entity camera look-controls></a-entity>
    </a-scene>

    <!-- 家具表示用のボタン -->
    <button id="show-model-btn">家具を表示</button>
    
    <script>
        // 平面検知に必要な変数
        let reticle = document.getElementById('reticle');
        let furniture = document.getElementById('simplelowtable');
    
        // ボタンで家具を平面検知位置に配置
        document.getElementById('show-model-btn').addEventListener('click', () => {
            if (reticle.getAttribute('visible')) {
                const position = reticle.getAttribute('position');
                furniture.setAttribute('position', position);
                furniture.setAttribute('visible', true);
            } else {
                alert("平面を検知してください！");
            }
        });
    
        AFRAME.registerComponent('ar-hit-test', {
            init: function () {
                const sceneEl = this.el.sceneEl;
                const xrSession = sceneEl.renderer.xr.getSession();
    
                xrSession.requestReferenceSpace('local').then(refSpace => {
                    xrSession.addEventListener('select', () => {
                        if (this.reticle.visible) {
                            // 平面位置を取得して表示
                            const hitTestResults = xrFrame.getHitTestResults(this.hitTestSource);
                            if (hitTestResults.length > 0) {
                                const pose = hitTestResults[0].getPose(refSpace);
                                this.reticle.setAttribute('visible', true);
                                this.reticle.setAttribute('position', {
                                    x: pose.transform.position.x,
                                    y: pose.transform.position.y,
                                    z: pose.transform.position.z
                                });
                            }
                        }
                    });
                });
            }
        });
    </script>
</body>
</html>
