<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Furniture Placement - Markerless AR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <style>
        #show-model-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #show-model-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body style="margin: 0; padding: 0;">

    <!-- A-Frame Scene -->
    <a-scene webxr="optionalFeatures: hit-test;" renderer="logarithmicDepthBuffer: true" embedded>
        <!-- Reticle for detected surfaces -->
        <a-entity id="reticle" geometry="primitive: ring; radiusInner: 0.05; radiusOuter: 0.1;"
                  material="color: yellow; shader: flat;" position="0 0 -5" visible="false"></a-entity>

        <!-- 3D Furniture Model -->
        <a-entity id="simplelowtable" gltf-model="url(./models/simplelowtable.glb)" scale="0.5 0.5 0.5" visible="false"></a-entity>

        <!-- Camera -->
        <a-entity camera look-controls></a-entity>
    </a-scene>

    <!-- Button -->
    <button id="show-model-btn">家具を配置する</button>

    <script>
        let reticle = document.getElementById('reticle');
        let furniture = document.getElementById('simplelowtable');

        // Handle button click to place the furniture
        document.getElementById('show-model-btn').addEventListener('click', () => {
            if (reticle.getAttribute('visible')) {
                const position = reticle.getAttribute('position');
                furniture.setAttribute('position', position);
                furniture.setAttribute('visible', true);
            } else {
                alert("平面を検知してください！");
            }
        });

        // Register A-Frame component for hit testing
        AFRAME.registerComponent('ar-hit-test', {
            init: function () {
                const sceneEl = this.el.sceneEl;
                const renderer = sceneEl.renderer;
                const xrSession = renderer.xr.getSession();

                let hitTestSource = null;
                let referenceSpace = null;

                xrSession.requestReferenceSpace('viewer').then((refSpace) => {
                    referenceSpace = refSpace;
                    xrSession.requestHitTestSource({ space: refSpace }).then((source) => {
                        hitTestSource = source;
                    });
                });

                // Update reticle position
                this.el.sceneEl.addEventListener('updateframe', (event) => {
                    if (!hitTestSource) return;

                    const frame = event.detail;
                    const hitTestResults = frame.getHitTestResults(hitTestSource);

                    if (hitTestResults.length > 0) {
                        const hitPose = hitTestResults[0].getPose(referenceSpace);

                        reticle.setAttribute('visible', true);
                        reticle.setAttribute('position', {
                            x: hitPose.transform.position.x,
                            y: hitPose.transform.position.y,
                            z: hitPose.transform.position.z,
                        });
                    } else {
                        reticle.setAttribute('visible', false);
                    }
                });
            }
        });

        // Attach the AR hit test component to the scene
        document.querySelector('a-scene').setAttribute('ar-hit-test', '');
    </script>
</body>
</html>
