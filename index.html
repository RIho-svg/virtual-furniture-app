<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Furniture Placement - Markerless AR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
</head>
<body style="margin: 0; padding: 0;">

    <!-- A-Frameシーン -->
    <a-scene embedded arjs>
        <!-- 家具の3Dモデル -->
        <a-entity id="simplelowtable" gltf-model="url(simplelowtable.glb)" scale="0.5 0.5 0.5" position="0 0 0" visible="false"></a-entity>

        <!-- カメラ -->
        <a-entity camera look-controls></a-entity>
    </a-scene>

    <!-- 家具を表示するボタン -->
    <button id="show-model-btn" style="position: absolute; top: 10px; left: 10px; z-index: 10;">
        ローテーブル
    </button>

    <script>
        let button = document.getElementById('show-model-btn');
        let furniture = document.getElementById('simplelowtable');
        let scene = document.querySelector('a-scene');

        // ボタンクリックで3Dモデルを表示
        button.addEventListener('click', function () {
            furniture.setAttribute('visible', true);
        });

        // タップイベントで家具の位置を変更
        scene.addEventListener('click', function (event) {
            let touch = event.detail.intersection;
            if (touch) {
                let position = touch.point; // タップ位置を取得
                furniture.setAttribute('position', position);
            }
        });
    </script>

</body>
</html>
