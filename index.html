<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Furniture Placement - Markerless AR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
</head>
<body style="margin: 0; padding: 0;">

    <!-- A-Frameシーン -->
    <a-scene 
        embedded
        arjs="sourceType: camera; debugUIEnabled: false;">
        <!-- 家具の3Dモデル -->
        <a-entity 
            id="simplelowtable"
            gltf-model="url(./models/simplelowtable.glb)"
            scale="0.5 0.5 0.5"
            visible="false">
        </a-entity>

        <!-- カメラ -->
        <a-entity camera></a-entity>
    </a-scene>

    <!-- 家具を表示するボタン -->
    <button id="show-model-btn" style="position: absolute; top: 10px; left: 10px; z-index: 10;">
        シンプルなローテーブルを表示
    </button>

    <script>
        let button = document.getElementById('show-model-btn');
        let furniture = document.getElementById('simplelowtable');

        // ボタンクリックでhit-testを使い3Dモデルを表示
        button.addEventListener('click', function () {
            furniture.setAttribute('visible', true);

            // ヒットテスト用のイベントリスナーを追加
            document.querySelector('a-scene').addEventListener('onevent', function (event) {
                let hits = event.detail.intersections;
                if (hits.length > 0) {
                    let position = hits[0].point;
                    furniture.setAttribute('position', position);
                }
            });
        });
    </script>

</body>
</html>
