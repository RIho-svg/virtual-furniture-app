<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Furniture Placement - Markerless AR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
</head>
<body style="margin: 0; padding: 0;">

    <!-- A-Frameシーン -->
    <a-scene embedded arjs>
        <!-- 家具の3Dモデル -->
        <a-entity id="simplelowtable" 
                  gltf-model="url(simplelowtable.glb)" 
                  scale="0.5 0.5 0.5" 
                  position="0 0 -1" 
                  visible="false">
        </a-entity>

        <!-- カメラ -->
        <a-entity camera look-controls></a-entity>
    </a-scene>

    <!-- 家具を表示するボタン -->
    <button id="show-model-btn" style="position: absolute; top: 10px; left: 10px; z-index: 10;">
        Show Simple Low Table
    </button>

    <script>
        let button = document.getElementById('show-model-btn');
        let furniture = document.getElementById('simplelowtable');

        // ボタンクリックで3Dモデルを表示
        button.addEventListener('click', function () {
            // 3Dモデルを可視化
            furniture.setAttribute('visible', true);
        });

        // タップイベントで家具の位置を変更
        document.querySelector('a-scene').addEventListener('click', function (event) {
            // A-Frameのクリックイベント詳細情報からタップ位置を取得
            let intersection = event.detail.intersection;
            if (intersection) {
                let position = intersection.point; // タップ位置を取得
                furniture.setAttribute('position', position); // 家具の位置を更新
            }
        });
    </script>

</body>
</html>
